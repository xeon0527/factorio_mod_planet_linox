[mod-setting-description]
linox-settings_enable-moshine-neodymium-recipe=启用时，可以将灼原星（Moshine）的钕加工为钕粉。
linox-settings_allow-hopper-launcher=启用时，可以在日凌星上放置载人发射井，同时允许在枢纽平台地格上放置载人发射井。
linox-settings_compatibility-aai-signal-transmission=启用时，日凌星会改动AAI信号传输（AAI Signal Transmission），将其置入自身游玩流程。
linox-settings_compatibility-distribution-request-planner=启用时，日凌星会改动该模组（Distribution Request Planner），将其置入自身游玩流程。

linox-settings_rbp-example-multiplay-language=此设置项用于本地化递归蓝图示例的说明，仅作用于多人游戏。若设置为自动，则选用首个检测到的语言。根据当前本地化缓存的状态，即便选择了其他语言，也有可能不按设置显示。
linox-settings_rbp-example-local-language=此设置项用于本地化递归蓝图示例的说明。若设置为自动，则选用当前游戏的语言。根据当前本地化缓存的状态，即便选择了其他语言，也有可能不按设置显示。

linox-settings_easy-mode_anywhere-mantle-extractor=移除地核提取机的放置限制。
linox-settings_easy-mode_remove-vanilla-circuit-collision=移除原版信号网络实体的碰撞箱，这些实体不会再阻碍移动。本设置在启用“吱吱穿越2”（Squeak Through 2）模组时无效。
linox-settings_hard-mode_no-logistic-system=不再将“物流系统”科技设为“发现星球：日凌星”科技的前置，同时从开局物品中去除所有与物流相关的物品。\n\n[color=yellow]警告：启用此设置会导致开局示例无法正常工作。此设置只会将“物流系统”科技移出日凌星前置，不会从游戏中去除该科技。[/color]
linox-settings_hard-mode_no-starter-pack=移除所有解锁地下设施后给予的开局物品。玩家必须从头制造才可继续游戏流程。
linox-settings_hard-mode_use-surface-condition=启用表面限制，所有日凌星最终产物只可在日凌星上制造。\n\n[color=yellow]警告：由于日凌星可建设面积优先，此设置可能会成为几乎无法消除的严重物流瓶颈。[/color]\n\n[color=red]危险：此设置会带来极大的痛苦！[/color]
linox-settings_hard-mode_enable-science-pack_aquilo=启用日凌科技包配方，并向玄冥星科技树引入该科技包。\n\n[color=yellow]警告：由于日凌星可建设面积优先，此设置可能会成为几乎无法消除的严重物流瓶颈。[/color]
linox-settings_hard-mode_enable-science-pack_promethium=启用日凌科技包配方，并向钷素科技树引入该科技包。\n\n[color=yellow]警告：由于日凌星可建设面积优先，此设置可能会成为几乎无法消除的严重物流瓶颈。[/color]

