linox-settings_allow-hopper-launcher=[color=yellow]<兼容>[/color] 载人发射井 :: 允许放置载人发射井
linox-settings_compatibility-aai-signal-transmission=[color=yellow]<兼容>[/color] AAI信号传输 :: 改至日凌星
linox-settings_compatibility-distribution-request-planner=[color=yellow]<兼容>[/color] 物流分配请求规划器 :: 改至日凌星

linox-settings_rbp-example-multiplay-language=递归蓝图示例 – 多人游戏语言设置
linox-settings_rbp-example-local-language=递归蓝图示例 – 个人语言设置

linox-settings_easy-mode_remove-vanilla-circuit-collision=[color=green]<简单>[/color] 移除原版信号网络实体碰撞箱
linox-settings_easy-mode_anywhere-mantle-extractor=[color=green]<简单>[/color] 取消地幔提取机的表面限制
